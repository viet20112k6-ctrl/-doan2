<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c6542d" />
    <meta
      name="description"
      content="EnCiVi — nội thất tinh gọn cho từng góc nhà. Khám phá phòng khách, phòng ngủ và phòng ăn theo phong cách của bạn."
    />
    <title>Giỏ hàng của bạn | EnCiVi</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="cart">
    <a class="skip-link" href="#main">Đến nội dung chính</a>
    <div data-include="components/header.html"></div>
    <main id="main" tabindex="-1">
      <noscript
        ><div class="noscript">
          Hãy bật JavaScript để sử dụng các chức năng EnCiVi.
        </div></noscript
      >
      <section id="view-cart" class="view" aria-labelledby="cartPageTitle">
        <div class="container page-shell">
          <div class="page-heading">
            <p class="eyebrow">EnCiVi / Lựa chọn của bạn</p>
            <h1 id="cartPageTitle">Giỏ hàng của bạn</h1>
            <p id="cartPageCount"></p>
          </div>
          <div class="checkout-layout">
            <div class="panel" id="cartPageItems"></div>
            <aside class="panel summary-panel">
              <h2>Tóm tắt giỏ hàng</h2>
              <div class="totals">
                <div class="total-line grand-total">
                  <span>Tạm tính</span><strong id="cartPageSubtotal"></strong>
                </div>
              </div>
              <p class="detail-footnote">
                Phí giao hàng miễn phí trong bản mô phỏng.
              </p>
              <button
                class="btn btn-primary btn-wide"
                data-action="checkout"
                id="cartPageCheckoutButton"
              >
                Tiếp tục đặt hàng</button
              ><a class="text-button btn-wide" href="san-pham.html"
                >Tiếp tục chọn sản phẩm</a
              >
            </aside>
          </div>
        </div>
      </section>
    </main>
    <div data-include="components/footer.html"></div>
    <div data-include="components/dialogs.html"></div>
    <div data-include="components/icons.html"></div>
    <script src="js/layout.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
