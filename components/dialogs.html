<dialog id="cartDialog" class="cart-dialog" aria-labelledby="cartTitle">
  <div class="cart-content">
    <div class="dialog-head">
      <h2 id="cartTitle">
        Giỏ hàng <span class="muted small" id="cartCount"></span>
      </h2>
      <button
        class="icon-button"
        data-action="close-dialog"
        aria-label="Đóng giỏ hàng"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="total-line">
        <span>Tạm tính</span><strong id="cartSubtotal"></strong>
      </div>
      <p>Phí giao hàng miễn phí trong bản mô phỏng.</p>
      <button
        class="btn btn-primary btn-wide"
        data-action="checkout"
        id="checkoutButton"
      >
        Tiếp tục đặt hàng</button
      ><button class="text-button" data-action="close-dialog">
        Tiếp tục mua sắm
      </button>
    </div>
  </div>
</dialog>
<dialog id="accountDialog" aria-labelledby="accountTitle">
  <div class="dialog-head">
    <h2 id="accountTitle">Tài khoản của bạn</h2>
    <button
      class="icon-button"
      data-action="close-dialog"
      aria-label="Đóng tài khoản"
    >
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog-body">
    <div class="account-current">
      <strong id="accountName"></strong>
      <p id="accountUsername" class="muted"></p>
      <p id="accountEmail"></p>
      <span id="accountRole" class="account-role"></span>
    </div>
    <div class="account-links">
      <a class="btn btn-outline" href="don-hang.html">Đơn hàng của tôi</a
      ><a
        class="btn btn-outline"
        href="quan-tri.html"
        id="accountAdminLink"
        hidden
        >Quản lý cửa hàng</a
      >
    </div>
    <button class="text-button" data-action="logout" id="logoutButton">
      Đăng xuất
    </button>
  </div>
</dialog>
<dialog
  id="productDialog"
  class="product-dialog"
  aria-labelledby="productDialogTitle"
>
  <div class="dialog-head">
    <h2 id="productDialogTitle">Thêm sản phẩm</h2>
    <button
      class="icon-button"
      data-action="close-dialog"
      aria-label="Đóng chỉnh sửa sản phẩm"
    >
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog-body">
    <form id="productForm">
      <input id="prodId" type="hidden" />
      <div class="form-grid">
        <div class="field full">
          <label for="prodName"
            >Tên sản phẩm <span class="required">*</span></label
          ><input id="prodName" required="" maxlength="120" minlength="2" />
        </div>
        <div class="field">
          <label for="prodCategory"
            >Không gian <span class="required">*</span></label
          ><select id="prodCategory">
            <option>Phòng Khách</option>
            <option>Phòng Ngủ</option>
            <option>Phòng Ăn</option>
          </select>
        </div>
        <div class="field">
          <label for="prodPrice"
            >Giá bán (₫) <span class="required">*</span></label
          ><input
            id="prodPrice"
            type="number"
            min="1000"
            max="1000000000"
            step="1000"
            inputmode="numeric"
            required=""
          />
        </div>
        <div class="field full">
          <label for="prodOldPrice">Giá trước giảm (₫, không bắt buộc)</label
          ><input
            id="prodOldPrice"
            type="number"
            min="0"
            max="1000000000"
            step="1000"
            inputmode="numeric"
          />
          <p class="hint">Để trống nếu sản phẩm không có giảm giá.</p>
        </div>
        <div class="field full">
          <label for="prodImage"
            >Đường dẫn ảnh HTTPS
            <span class="required" id="imageRequired">*</span></label
          ><input
            id="prodImage"
            type="url"
            maxlength="1500"
            placeholder="https://…"
          />
          <p class="hint" id="prodImageHint">
            Dùng đường dẫn trực tiếp đến ảnh sản phẩm.
          </p>
        </div>
        <div class="field full">
          <label for="prodDesc">Mô tả <span class="required">*</span></label
          ><textarea
            id="prodDesc"
            required=""
            maxlength="1500"
            rows="3"
          ></textarea>
        </div>
      </div>
      <p class="form-error" id="productError" role="alert" hidden=""></p>
      <div class="dialog-actions">
        <button
          type="button"
          class="btn btn-outline"
          data-action="close-dialog"
        >
          Hủy</button
        ><button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
      </div>
    </form>
  </div>
</dialog>
<dialog id="infoDialog" aria-labelledby="infoTitle">
  <div class="dialog-head">
    <h2 id="infoTitle"></h2>
    <button
      class="icon-button"
      data-action="close-dialog"
      aria-label="Đóng thông tin"
    >
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog-body dialog-info-copy" id="infoContent"></div>
</dialog>
<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <div class="dialog-head">
    <h2 id="confirmTitle"></h2>
    <button
      class="icon-button"
      data-action="close-dialog"
      aria-label="Đóng xác nhận"
    >
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog-body">
    <p id="confirmDescription"></p>
    <div class="dialog-actions">
      <button class="btn btn-outline" data-action="close-dialog">
        Giữ nguyên</button
      ><button class="btn btn-primary" data-action="confirm" id="confirmButton">
        Xác nhận
      </button>
    </div>
  </div>
</dialog>
<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  hidden=""
>
  <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg
  ><span id="toastText"></span>
</div>
