<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c6542d" />
    <meta
      name="description"
      content="EnCiVi — nội thất tinh gọn cho từng góc nhà. Khám phá phòng khách, phòng ngủ và phòng ăn theo phong cách của bạn."
    />
    <title>Chi tiết sản phẩm | EnCiVi</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="detail">
    <a class="skip-link" href="#main">Đến nội dung chính</a>
    <div data-include="components/header.html"></div>
    <main id="main" tabindex="-1">
      <noscript
        ><div class="noscript">
          Hãy bật JavaScript để sử dụng các chức năng EnCiVi.
        </div></noscript
      >
      <section id="view-detail" class="view" aria-labelledby="detailTitle">
        <div class="container page-shell">
          <div class="breadcrumbs">
            <a data-view="home" href="index.html">Trang chủ</a><span>/</span
            ><a data-view="shop" href="san-pham.html">Sản phẩm</a><span>/</span
            ><span id="detailCrumb"></span>
          </div>
          <div class="detail-grid" id="detailContent">
            <div>
              <div class="detail-image">
                <img id="detailImage" alt="" width="800" height="800" />
              </div>
              <div
                class="thumbnails"
                id="detailThumbnails"
                aria-label="Ảnh sản phẩm"
              ></div>
            </div>
            <div class="detail-info">
              <p class="eyebrow" id="detailCategory"></p>
              <h1 id="detailTitle"></h1>
              <div class="price-row">
                <span class="price" id="detailPrice"></span
                ><span class="old-price" id="detailOldPrice"></span>
              </div>
              <p class="detail-description" id="detailDescription"></p>
              <div class="option-block">
                <p class="option-label">
                  Màu sắc: <span id="detailColorLabel"></span>
                </p>
                <div
                  class="options"
                  id="detailColors"
                  role="group"
                  aria-label="Chọn màu sắc"
                ></div>
              </div>
              <div class="option-block">
                <p class="option-label">
                  Kích thước: <span id="detailSizeLabel"></span>
                </p>
                <div
                  class="options"
                  id="detailSizes"
                  role="group"
                  aria-label="Chọn kích thước"
                ></div>
              </div>
              <div class="add-row">
                <div class="quantity" aria-label="Số lượng sản phẩm">
                  <button
                    data-action="detail-qty"
                    data-delta="-1"
                    aria-label="Giảm số lượng"
                  >
                    −</button
                  ><output id="detailQty" aria-live="polite">1</output
                  ><button
                    data-action="detail-qty"
                    data-delta="1"
                    aria-label="Tăng số lượng"
                  >
                    +
                  </button>
                </div>
                <button
                  class="btn btn-primary btn-wide"
                  data-action="add-detail"
                >
                  Thêm vào giỏ hàng
                </button>
              </div>
              <p class="detail-footnote">
                Hình ảnh và giá dùng cho bản trình diễn EnCiVi.
              </p>
            </div>
          </div>
          <div id="productMissing" class="empty-state" hidden="">
            <h2 id="productMissingTitle">Sản phẩm không còn trong danh mục</h2>
            <p>Hãy chọn một món nội thất khác.</p>
            <a class="btn btn-primary" href="san-pham.html"
              >Xem tất cả sản phẩm</a
            >
          </div>
        </div>
      </section>
    </main>
    <div data-include="components/footer.html"></div>
    <div data-include="components/dialogs.html"></div>
    <div data-include="components/icons.html"></div>
    <script src="js/layout.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
