<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký – Nội thất Mộc An</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-banner" style="margin-bottom:0;">
      <div class="container">
        <h1>Tài khoản thành viên</h1>
        <p>Đăng nhập hoặc tạo tài khoản mới để mua sắm và theo dõi đơn hàng dễ dàng</p>
      </div>
    </section>

    <div class="container">
      <div class="auth-grid">
        <!-- Form Đăng nhập -->
        <div class="card-box">
          <h2 style="margin-bottom:6px;">Đăng nhập</h2>
          <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:18px;">
            Tài khoản khách mẫu: <strong>khachhang@mocan.vn</strong> / <strong>123456</strong>
          </p>
          <div id="login-error" class="alert alert-error" style="display:none;"></div>
          <form id="login-form">
            <div class="form-group">
              <label for="login-email">Email đăng nhập</label>
              <input type="email" id="login-email" class="form-control" placeholder="khachhang@mocan.vn" required>
            </div>
            <div class="form-group">
              <label for="login-password">Mật khẩu</label>
              <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Đăng nhập</button>
          </form>
        </div>

        <!-- Form Đăng ký -->
        <div class="card-box" id="register">
          <h2 style="margin-bottom:6px;">Đăng ký tài khoản mới</h2>
          <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:18px;">
            Tạo tài khoản nhanh chỉ trong 30 giây để hưởng ưu đãi thành viên Mộc An.
          </p>
          <div id="register-msg" class="alert" style="display:none;"></div>
          <form id="register-form">
            <div class="form-group">
              <label for="reg-name">Họ và tên *</label>
              <input type="text" id="reg-name" class="form-control" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="form-group">
              <label for="reg-email">Email *</label>
              <input type="email" id="reg-email" class="form-control" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
              <label for="reg-phone">Số điện thoại *</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="09xxxxxxxx" required>
            </div>
            <div class="form-group">
              <label for="reg-password">Mật khẩu (tối thiểu 6 ký tự) *</label>
              <input type="password" id="reg-password" class="form-control" placeholder="••••••" required>
            </div>
            <div class="form-group">
              <label for="reg-confirm">Xác nhận mật khẩu *</label>
              <input type="password" id="reg-confirm" class="form-control" placeholder="Nhập lại mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">Đăng ký tài khoản</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>initAuthPage();</script>
</body>
</html>
